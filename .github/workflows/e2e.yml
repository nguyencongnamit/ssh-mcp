name: E2E

# Builds the Docker test bed (a real Linux target bootstrapped with
# deploy/bootstrap-target.sh, plus the server) and runs the attack suite.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache: true }
      - name: Host prerequisites (Ubuntu 24.04)
        # Ubuntu 24.04 restricts unprivileged user namespaces (bubblewrap) and
        # ships an AppArmor profile for fusermount3 that confines its mount
        # targets. Both apply to processes inside containers. Production
        # servers on 24.04 need the same (see docs/deployment.md).
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          if [ -e /etc/apparmor.d/fusermount3 ]; then sudo apparmor_parser -R /etc/apparmor.d/fusermount3 || true; fi
      - name: Bring up test bed
        working-directory: testbed
        run: ./up.sh
      - name: Attack suite
        run: go test -tags e2e -count=1 -v ./testbed/e2e/
      - name: Logs on failure
        if: failure()
        working-directory: testbed
        run: docker compose logs --no-color | tail -300
      - name: Tear down
        if: always()
        working-directory: testbed
        run: docker compose down -v

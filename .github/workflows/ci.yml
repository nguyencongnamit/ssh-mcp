name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (race + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache: true }
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./... && go vet -tags e2e ./testbed/e2e/
      - name: Tests
        run: |
          go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
      - name: Coverage floor on the security boundary
        run: |
          # The packages that enforce read-only must stay well tested.
          for pkg in internal/authn internal/helper internal/identity internal/pathpolicy internal/protocol internal/policy internal/redact; do
            pct=$(go test -count=1 -cover ./$pkg | grep -oE '[0-9.]+% of statements' | grep -oE '^[0-9.]+')
            echo "$pkg: ${pct}%"
            awk "BEGIN{exit !(${pct} >= 70)}" || { echo "::error::$pkg coverage ${pct}% is below the 70% floor"; exit 1; }
          done
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: FuzzParseAndNormalize, pkg: ./internal/protocol }
          - { target: FuzzDefaultPolicy, pkg: ./internal/pathpolicy }
          - { target: FuzzCertPolicy, pkg: ./internal/helper }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache: true }
      - name: Fuzz for 60s
        env:
          TARGET: ${{ matrix.target }}
          PKG: ${{ matrix.pkg }}
        run: go test "$PKG" -run '^$' -fuzz "^${TARGET}\$" -fuzztime 60s
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: '**/testdata/fuzz/'

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache: true }
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath ./cmd/ssh-mcp
      - if: matrix.goos == 'linux'
        run: CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build -trimpath ./cmd/ssh-mcp-helper

  bootstrap-lint:
    name: ShellCheck deploy scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: shellcheck -S warning deploy/*.sh testbed/*.sh testbed/server/entrypoint.sh

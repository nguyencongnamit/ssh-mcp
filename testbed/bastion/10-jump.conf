# The jump account may open TCP channels to the target's sshd and nothing
# else: no shell, no tty, no other destinations.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
LogLevel VERBOSE
Match User ssh-mcp-jump
    AllowTcpForwarding local
    PermitOpen target:22
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    PermitTunnel no
    ForceCommand /bin/false

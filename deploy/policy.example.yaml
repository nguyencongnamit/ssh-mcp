# Deny by default. A call is allowed when one rule matches caller, host and tool.
# group takes a value of the caller's groups: an Entra group object ID or
# app-role name, or a generic OIDC groups-claim value (entra_group is an alias).
# user takes the immutable subject (Entra oid or OIDC sub); emails are rejected.
# paths is signed into every certificate and enforced on the host as well.
rules:
  - name: oncall-everything
    who: { group: <platform-oncall-group-id> }
    hosts: { tags: { env: [staging, prod] } }
    tools: ["*"]
  - name: developers-staging
    who: { group: <developers-group-id> }
    hosts: { tags: { env: [staging] } }
    tools: [list_hosts, host_overview, journal, read_file, tail_file, list_dir, sandbox_exec]
  - name: triage-bot
    who: { token: triage-bot }
    hosts: { tags: { env: [prod] } }
    tools: [journal, tail_file]
    rate: 60/min
paths:
  allow: [/var/log/, /etc/]
  deny: [/etc/app/private/]   # added to the built-in deny list, never replacing it
